name: Tests

# Runs every test in the repository:
#   - framework unit tests + "generated code is up to date" gate (no Docker)
#   - the demo-shop example API suite against its docker-compose stack
#     (SQL Server, Redis, AuthService, ProductService, OrderService)
#
#   - pull requests / pushes to develop: automatically
#   - manually: Actions -> Tests -> "Run workflow" (optional NUnit filter)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      filter:
        description: 'NUnit filter for the example API tests, e.g. "FullyQualifiedName~OrderService" (empty = all tests)'
        required: false
        default: ''
      smoke:
        description: 'Also run the Python smoke/contract runner against the live stack'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: ApiTestFramework.sln
  FRAMEWORK_TESTS: framework/tests/ApiTestFramework.Framework.Tests/ApiTestFramework.Framework.Tests.csproj
  EXAMPLE_TESTS: examples/demo-shop/api-tests/DemoShop.Tests/DemoShop.Tests.csproj
  EXAMPLE_COMPOSE: examples/demo-shop/docker-compose.yml
  GENERATOR: framework/src/ApiTestFramework.Generator.Cli
  GENERATOR_CONFIG: examples/demo-shop/api-tests/generator.json

jobs:
  # ── Fast feedback: no Docker, no services ──────────────────────────────────
  unit:
    name: Build, framework unit tests & generated code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: |
          dotnet restore "$SOLUTION"
          dotnet build "$SOLUTION" -c Release --no-restore

      - name: Framework unit tests
        run: >
          dotnet test "$FRAMEWORK_TESTS" -c Release --no-build
          --logger "trx;LogFileName=framework.trx"
          --results-directory test-results

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generated code is up to date
        run: |
          # Builders, test scaffolds, collections and k6 scripts must match the committed swagger
          dotnet run --project "$GENERATOR" -c Release -- --config "$GENERATOR_CONFIG"
          python tools/generate_collections.py
          python tools/generate_k6.py
          # scaffolds carry a generation timestamp: ignore that line only
          if ! git diff --exit-code -I 'Generated: [0-9]' -- examples/; then
            echo "::error::Generated files are stale. Run examples/demo-shop/api-tests/scripts/regenerate-all.ps1 and the Python generators, then commit."
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all -- examples/ | grep '^??' || true)"
          if [ -n "$untracked" ]; then
            echo "::error::Generation produced new, uncommitted files:"
            echo "$untracked"
            exit 1
          fi

      - name: Python tooling against the in-memory mock
        run: |
          python tools/mock_server.py > mock-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5100/api/products && break
            sleep 1
          done
          python tools/smoke_runner.py --json test-results/smoke-mock.json

      - name: Test summary
        if: always()
        run: python scripts/ci/trx-summary.py "Framework unit tests" test-results/*.trx >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            test-results/
            mock-server.log
          if-no-files-found: ignore

  # ── Example API suite against the real stack ───────────────────────────────
  integration:
    name: Example API tests (demo-shop stack)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    env:
      # OAuth2 client secrets: the same value for the demo authorization server (compose) and the
      # tests / smoke runner. Repository secrets win; the fallbacks are the demo stack's defaults.
      CATALOG_CLIENT_SECRET: ${{ secrets.CATALOG_CLIENT_SECRET || 'catalog-api-tests-secret' }}
      ORDERS_CLIENT_SECRET: ${{ secrets.ORDERS_CLIENT_SECRET || 'orders-api-tests-secret' }}
      TEST_Authentication__Clients__Catalog__OAuth2__ClientSecret: ${{ secrets.CATALOG_CLIENT_SECRET || 'catalog-api-tests-secret' }}
      TEST_Authentication__Clients__Orders__OAuth2__ClientSecret: ${{ secrets.ORDERS_CLIENT_SECRET || 'orders-api-tests-secret' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: |
          dotnet restore "$SOLUTION"
          dotnet build "$SOLUTION" -c Release --no-restore

      - name: Start example services
        run: docker compose -f "$EXAMPLE_COMPOSE" up -d --build --wait --wait-timeout 600

      - name: Capture live swagger
        run: |
          mkdir -p live-swagger
          curl -sf http://localhost:5300/swagger/v1/swagger.json -o live-swagger/auth-swagger.json
          curl -sf http://localhost:5100/swagger/v1/swagger.json -o live-swagger/product-swagger.json
          curl -sf http://localhost:5200/swagger/v1/swagger.json -o live-swagger/order-swagger.json

      - name: Run example API tests
        env:
          FILTER: ${{ github.event.inputs.filter }}
        run: |
          args=()
          if [ -n "$FILTER" ]; then args+=(--filter "$FILTER"); fi
          dotnet test "$EXAMPLE_TESTS" -c Release --no-build "${args[@]}" \
            --logger "trx;LogFileName=example.trx" \
            --results-directory test-results

      - uses: actions/setup-python@v5
        if: always() && github.event.inputs.smoke != 'false'
        with:
          python-version: '3.12'

      - name: Python smoke & contract checks (live stack)
        if: always() && github.event.inputs.smoke != 'false'
        run: python tools/smoke_runner.py --role Admin --json test-results/smoke-live.json

      - name: Test summary
        if: always()
        run: python scripts/ci/trx-summary.py "Example API tests" test-results/*.trx >> "$GITHUB_STEP_SUMMARY"

      - name: Contract coverage
        if: always()
        run: |
          report=$(find examples -path "*/bin/*/contract-coverage/contract-coverage.md" | head -1)
          if [ -n "$report" ]; then
            mkdir -p contract-coverage
            cp "$(dirname "$report")"/* contract-coverage/
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect Allure results & service logs
        if: always()
        run: |
          mkdir -p allure-results
          # Allure.NUnit 2.12.x writes next to the test assembly, not to the workspace root
          find examples -path "*/bin/*/allure-results" -type d -exec cp -r {}/. allure-results/ \;
          docker compose -f "$EXAMPLE_COMPOSE" logs --no-color > service-logs.txt 2>&1 || true

      - name: Generate Allure report (single file)
        if: always()
        run: |
          if [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            # --single-file: one self-contained index.html (attachments embedded) that opens
            # straight from disk — no web server, no Allure CLI needed to view it
            npx --yes allure-commandline@2.29.0 generate allure-results -o allure-report --clean --single-file
          fi

      - name: Upload Allure report
        id: allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/index.html
          if-no-files-found: ignore

      - name: Link the Allure report in the summary
        if: always() && steps.allure.outputs.artifact-url != ''
        run: |
          {
            echo "### Allure report"
            echo ""
            echo "[Download allure-report](${{ steps.allure.outputs.artifact-url }}) — one self-contained \`index.html\`; unzip and open it in a browser."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results/
            allure-results/
            contract-coverage/
            live-swagger/
            service-logs.txt
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: docker compose -f "$EXAMPLE_COMPOSE" down -v
