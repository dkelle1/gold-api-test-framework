# Demo-shop example stack: SQL Server, Redis and the three example services.
# This is the "system under test" for the example API tests — not part of the framework.
#   docker compose -f examples/demo-shop/docker-compose.yml up -d --build --wait
# Ports and secrets come from variables with the defaults below; to use the repository-root .env:
#   docker compose --env-file .env -f examples/demo-shop/docker-compose.yml up -d --build --wait
# (variables: SQL_PORT, REDIS_PORT, AUTH_PORT, PRODUCT_PORT, ORDER_PORT, SA_PASSWORD, JWT_SECRET_KEY)
services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-ApiTest_Sa@2024}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD:-ApiTest_Sa@2024}' -Q 'SELECT 1' -C -b -o /dev/null"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
      start_period: 10s

  # ── Microservices ────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./services
      dockerfile: AuthService/Dockerfile
    container_name: auth-service
    ports:
      - "${AUTH_PORT:-5300}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AuthServiceDb;User Id=sa;Password=${SA_PASSWORD:-ApiTest_Sa@2024};TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-ApiTestFramework_SuperSecretKey_ForDevelopment_2024_MinLength32!}"
      Jwt__Issuer: "ApiTestFramework.AuthService"
      Jwt__Audience: "ApiTestFramework.Services"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      retries: 60
      start_period: 180s
      timeout: 5s

  product-service:
    build:
      context: ./services
      dockerfile: ProductService/Dockerfile
    container_name: product-service
    ports:
      - "${PRODUCT_PORT:-5100}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ProductServiceDb;User Id=sa;Password=${SA_PASSWORD:-ApiTest_Sa@2024};TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-ApiTestFramework_SuperSecretKey_ForDevelopment_2024_MinLength32!}"
      Jwt__Issuer: "ApiTestFramework.AuthService"
      Jwt__Audience: "ApiTestFramework.Services"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      retries: 60
      start_period: 180s
      timeout: 5s

  order-service:
    build:
      context: ./services
      dockerfile: OrderService/Dockerfile
    container_name: order-service
    ports:
      - "${ORDER_PORT:-5200}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderServiceDb;User Id=sa;Password=${SA_PASSWORD:-ApiTest_Sa@2024};TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      ProductServiceUrl: "http://product-service:8080"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-ApiTestFramework_SuperSecretKey_ForDevelopment_2024_MinLength32!}"
      Jwt__Issuer: "ApiTestFramework.AuthService"
      Jwt__Audience: "ApiTestFramework.Services"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      retries: 60
      start_period: 180s
      timeout: 5s

volumes:
  sqlserver_data:
  redis_data:
