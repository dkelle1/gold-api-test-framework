services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  consul:
    image: hashicorp/consul:1.18
    container_name: consul
    ports:
      - "8500:8500"   # HTTP API + UI
      - "8600:8600/udp" # DNS
    command: "agent -dev -client=0.0.0.0 -ui"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 3s

  # Runs once after Consul is healthy; registers all service base-urls in KV.
  consul-init:
    image: curlimages/curl:8.7.1
    container_name: consul-init
    depends_on:
      consul:
        condition: service_healthy
    entrypoint: >
      sh -c "
        BASE=http://consul:8500/v1/kv/api-test-framework &&
        curl -sS -X PUT $$BASE/Services/AuthService/BaseUrl    -d 'http://auth-service:8080'    &&
        curl -sS -X PUT $$BASE/Services/ProductService/BaseUrl -d 'http://product-service:8080' &&
        curl -sS -X PUT $$BASE/Services/OrderService/BaseUrl   -d 'http://order-service:8080'   &&
        curl -sS -X PUT $$BASE/DefaultTimeoutSeconds           -d '30'                           &&
        curl -sS -X PUT $$BASE/RetryCount                      -d '0'                            &&
        echo 'consul-init: KV seeding done'
      "
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "ApiTest_Sa@2024"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ApiTest_Sa@2024' -Q 'SELECT 1' -C -b -o /dev/null"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
      start_period: 10s

  # ── Microservices ────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    container_name: auth-service
    ports:
      - "5300:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AuthServiceDb;User Id=sa;Password=ApiTest_Sa@2024;TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      Jwt__SecretKey: "ApiTestFramework_SuperSecretKey_ForDevelopment_2024_MinLength32!"
      Jwt__Issuer: "ApiTestFramework.AuthService"
      Jwt__Audience: "ApiTestFramework.Services"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      retries: 60
      start_period: 180s
      timeout: 5s

  product-service:
    build:
      context: .
      dockerfile: src/ProductService/Dockerfile
    container_name: product-service
    ports:
      - "5100:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ProductServiceDb;User Id=sa;Password=ApiTest_Sa@2024;TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      Jwt__SecretKey: "ApiTestFramework_SuperSecretKey_ForDevelopment_2024_MinLength32!"
      Jwt__Issuer: "ApiTestFramework.AuthService"
      Jwt__Audience: "ApiTestFramework.Services"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      retries: 60
      start_period: 180s
      timeout: 5s

  order-service:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    container_name: order-service
    ports:
      - "5200:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderServiceDb;User Id=sa;Password=ApiTest_Sa@2024;TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      ProductServiceUrl: "http://product-service:8080"
      Jwt__SecretKey: "ApiTestFramework_SuperSecretKey_ForDevelopment_2024_MinLength32!"
      Jwt__Issuer: "ApiTestFramework.AuthService"
      Jwt__Audience: "ApiTestFramework.Services"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      retries: 60
      start_period: 180s
      timeout: 5s

volumes:
  sqlserver_data:
  redis_data:
